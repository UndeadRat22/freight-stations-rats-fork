[technology-name]
freight-stations=Freight stations
freight-stations-steel=Steel freight stations
fluid-stations=Fluid stations
fluid-stations-steel=Steel fluid stations

[technology-description]
freight-stations=Long storage containers that sit alongside train wagons and link into one shared inventory.
freight-stations-steel=Wider freight stations with double stack sizes.
fluid-stations=Long fluid tanks that sit alongside fluid wagons and join into one shared tank.
fluid-stations-steel=Wider steel fluid stations that each hold ten fluid wagons.

[freight-stations-messages]
mismatched-connection=Can't connect: stations must match orientation and tier.
wrong-tier-balancer=Can't connect: iron stations need iron balancers, steel stations steel ones.
group-full=Group is over its __1__-station limit: extra stations add no space.
needs-rail=Must stand next to a straight rail running the same way, at most __1__ tiles from it.
needs-stop=Must stand beside the track of a train stop (at most __1__ tiles from it), level with one of the first __2__ wagons of a train stopped there.
slot-blocked=The wagon position this station snaps to is blocked.
tank-slot-blocked=The wagon position this tank snaps to is blocked, or a pipe there holds a different fluid.
different-fluids=Can't connect: the tanks hold different fluids.
no-gap=There's no gap between two stations here for this.

[entity-description]
freight-station-dismantling=A freight station marked for deconstruction, holding what its group couldn't keep. Construction robots empty it and then remove it; cancelling the deconstruction turns it back into a freight station.
underground-stock-balancer=Connects the stations either side of it, and pairs across the track with an underground stock balancer facing it to link both sides into one shared inventory.
underground-stock-balancer-steel=Connects the steel stations either side of it, and pairs across the track with a steel underground stock balancer facing it to link both sides into one shared inventory.
freight-station-placer=Long storage container that sits beside a stopped train, level with one of its wagons. Stations in a row joined by stock balancers share one inventory.
freight-station-h=Long storage container that sits beside a stopped train, level with one of its wagons. Stations in a row joined by stock balancers share one inventory.
freight-station-v=Long storage container that sits beside a stopped train, level with one of its wagons. Stations in a row joined by stock balancers share one inventory.
freight-station-steel-placer=Two tiles wide with double stack sizes. Sits beside a stopped train, level with one of its wagons, and links into one shared inventory with steel stock balancers.
freight-station-steel-h=Two tiles wide with double stack sizes. Sits beside a stopped train, level with one of its wagons, and links into one shared inventory with steel stock balancers.
freight-station-steel-v=Two tiles wide with double stack sizes. Sits beside a stopped train, level with one of its wagons, and links into one shared inventory with steel stock balancers.
stock-balancer=Placed in the gap between two freight stations, links them into one shared inventory.
stock-balancer-steel-placer=Placed in the gap between two steel freight stations, links them into one shared inventory.
stock-balancer-steel-h=Placed in the gap between two steel freight stations, links them into one shared inventory.
stock-balancer-steel-v=Placed in the gap between two steel freight stations, links them into one shared inventory.
fluid-station-placer=Long fluid tank that sits beside a stopped train, level with one of its wagons, and holds three fluid wagons. Tanks in a row joined by fluid balancers share one fluid. Pumps and pipes connect anywhere along its sides.
fluid-station-h=Long fluid tank that sits beside a stopped train, level with one of its wagons, and holds three fluid wagons. Tanks in a row joined by fluid balancers share one fluid. Pumps and pipes connect anywhere along its sides.
fluid-station-v=Long fluid tank that sits beside a stopped train, level with one of its wagons, and holds three fluid wagons. Tanks in a row joined by fluid balancers share one fluid. Pumps and pipes connect anywhere along its sides.
fluid-station-steel-placer=Two tiles wide and holds ten fluid wagons. Sits beside a stopped train, level with one of its wagons, and joins into one shared fluid with steel fluid balancers.
fluid-station-steel-h=Two tiles wide and holds ten fluid wagons. Sits beside a stopped train, level with one of its wagons, and joins into one shared fluid with steel fluid balancers.
fluid-station-steel-v=Two tiles wide and holds ten fluid wagons. Sits beside a stopped train, level with one of its wagons, and joins into one shared fluid with steel fluid balancers.
fluid-balancer=Placed in the gap between two fluid stations, joins them into one shared fluid. Can be walked over.
fluid-balancer-steel=Placed in the gap between two steel fluid stations, joins them into one shared fluid. Can be walked over.
underground-fluid-balancer=Joins the fluid stations either side of it, and connects under the track to an underground fluid balancer facing it, at most __1__ tiles away, so both sides share one fluid.
underground-fluid-balancer-steel=Joins the steel fluid stations either side of it, and connects under the track to a steel underground fluid balancer facing it, at most __1__ tiles away, so both sides share one fluid.
